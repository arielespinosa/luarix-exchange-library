site_name: luarix-exchange-library
site_description: Conectores de exchange/broker (Binance, Bitunix, MT5, Paper) detrás de una interfaz única, y los modelos que intercambian.
site_author: Luarix
repo_url: https://github.com/arielespinosa/luarix-exchange-library
# Sin enlace "editar esta página": el remoto es privado y el enlace solo daría
# un 404 a quien no tenga acceso.
edit_uri: ""

# `docs/plans/` son notas INTERNAS de trabajo (bugs.md, planes), no
# documentación de la librería. Se quedan en el repo pero fuera del sitio:
# mezclarlas confundiría a quien viene a aprender a usar el paquete.
exclude_docs: |
  plans/

theme:
  name: material
  language: es
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: es

nav:
  - Inicio: index.md
  - Instalación: instalacion.md
  - Inicio rápido: inicio-rapido.md
  - Conceptos:
      - Arquitectura: conceptos/arquitectura.md
      - Spot y futuros: conceptos/mercados.md
      - Modelos de dominio: conceptos/modelos.md
  - Guía de uso:
      - Credenciales: guia/credenciales.md
      - BrokerFactory: guia/factory.md
      - Velas: guia/velas.md
      - Balance y posiciones: guia/balance-y-posiciones.md
      - Órdenes: guia/ordenes.md
      - Take profit y stop loss: guia/tp-sl.md
      - Errores y diagnóstico: guia/errores.md
      - Añadir un exchange: guia/nuevo-exchange.md
  - Brokers:
      - Binance: brokers/binance.md
      - Bitunix: brokers/bitunix.md
      - PaperBroker: brokers/paper.md
      - MetaTrader 5: brokers/mt5.md
  - Integración:
      - Guía de migración: integracion/migracion.md
  - Referencia:
      - Contrato Broker: referencia/broker.md
      - Capacidades: referencia/capacidades.md
  - Estado y limitaciones: estado.md
